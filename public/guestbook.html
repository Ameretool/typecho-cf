<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guestbook | gb.ooo</title>
    <!-- 屏蔽搜索引擎 -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- 引入 Waline 样式 (紫色主题) -->
    <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
    
    <style>
        body {
            background: #050505; /* 极客纯黑背景 */
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .header p {
            color: #888;
            font-size: 0.9rem;
        }
        .back-link {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
        
        /* 核心容器 */
        #waline {
            width: 100%;
            max-width: 800px;
        }

        /* Waline 原生黑色主题适配 */
        :root {
            --waline-theme-color: #8b5cf6; /* 紫色主色调 */
            --waline-active-color: #a78bfa;
            --waline-color: #e5e7eb; /* 浅灰文字 */
            --waline-bg-color: #111; /* 深灰卡片背景 */
            --waline-bg-color-light: #1f2937;
            --waline-border-color: #333;
            --waline-disable-bg-color: #222;
            --waline-disable-color: #555;
            --waline-code-bg-color: #000;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✍️ Guestbook</h1>
        <p>Leave your footprint. <a href="https://gb.ooo" class="back-link">← Back to Base</a></p>
    </div>

    <!-- Waline 挂载点 -->
    <div id="waline"></div>

    <!-- 引入 Waline 核心 JS -->
    <script type="module">
        import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';

        init({
            el: '#waline',
            serverURL: 'https://gb.gb.ooo', // 🌟 这里填你刚刚绑定的新接口域名！
            lang: 'zh-CN',
            dark: 'html.dark', // 如果你有切换暗黑模式的需求
            meta: ['nick', 'mail', 'link'],
            requiredMeta: ['nick'],
            login: 'disable', // 允许匿名留言，降低门槛
            pageview: false
        });
    </script>
</body>
</html>
